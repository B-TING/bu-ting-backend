spring:
  ai:
    openai:
      api-key: ${AI_API_KEY:}
      base-url: ${AI_BASE_URL:https://api.openai.com}
      chat:
        model: ${AI_MODEL:gpt-4o-mini}
        temperature: 0.2
        response-format:
          type: JSON_OBJECT
  application:
    name: buting-be
  threads:
    virtual:
      enabled: true
  messages:
    basename: messages
    encoding: UTF-8
  jackson:
    time-zone: Asia/Seoul
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:50MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:50MB}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Seoul
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration

file-storage:
  s3:
    bucket: ${S3_BUCKET:}
    region: ${AWS_REGION:ap-northeast-2}
    key-prefix: ${S3_KEY_PREFIX:uploads}
    max-file-size: ${S3_MAX_FILE_SIZE:52428800}
    presigned-url-expiration: ${S3_PRESIGNED_URL_EXPIRATION:3600}

oauth:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
    allowed-audiences: ${GOOGLE_ALLOWED_AUDIENCES:${GOOGLE_AND_DEBUG_CLIENT_ID:},${GOOGLE_AND_RELEASE_CLIENT_ID:}}
  naver:
    client-id: ${NAVER_CLIENT_ID:}
    client-secret: ${NAVER_CLIENT_SECRET:}
    redirect-uri: ${NAVER_REDIRECT_URI:}
  kakao:
    client-id: ${KAKAO_REST_API_KEY:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
    allowed-audiences: ${KAKAO_ALLOWED_AUDIENCES:${KAKAO_AND_DEBUG_CLIENT_ID:}}

place:
  tour-api:
    base-url: ${TOUR_API_BASE_URL:https://apis.data.go.kr/B551011/KorService2}
    service-key: ${TOURISM_API_KEY:}
  google-places:
    base-url: ${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com/v1/places}
    api-key: ${GOOGLE_PLACES_API_KEY:}

travel-team:
  invite:
    base-url: ${TRAVEL_INVITE_BASE_URL:https://yourdomain.com/invite}

route:
  google:
    # Off by default: routes fall back to straight-line estimation.
    # Google returns transit routes only inside South Korea, so enabling this
    # improves transit times but not car or walking.
    enabled: ${ROUTE_GOOGLE_ENABLED:false}
    base-url: ${ROUTE_GOOGLE_BASE_URL:https://routes.googleapis.com/directions/v2}
    api-key: ${ROUTE_GOOGLE_API_KEY:${GOOGLE_PLACES_API_KEY:}}
    connect-timeout-seconds: ${ROUTE_GOOGLE_CONNECT_TIMEOUT_SECONDS:3}
    read-timeout-seconds: ${ROUTE_GOOGLE_READ_TIMEOUT_SECONDS:5}

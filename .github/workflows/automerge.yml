name: Auto Merge

# CI가 성공한 PR을 자동으로 squash 머지한다. workflow_run 은 기본 브랜치(dev)의 워크플로
# 파일로 돈다 -- 이 파일이 dev 에 머지된 뒤부터 이후 PR 에 적용된다.
# buting 적응: base=dev 인 PR 만 대상으로 한다. main 릴리스 PR 은 수동 머지한다 --
# GITHUB_TOKEN 으로 한 머지는 deploy.yml 을 트리거하지 않으므로 운영 배포가 돌지 않기 때문이다.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  # permissions 를 명시하면 적지 않은 스코프는 none 이 된다. 이게 없으면 PR 본문의
  # Closes #N 으로 연결된 이슈가 머지 후에도 닫히지 않는다.
  issues: write

jobs:
  automerge:
    # PR 이벤트로 돈 CI 가 성공했을 때만.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Squash-merge the PR whose CI passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # CI 가 돈 커밋(head_sha)에 해당하는 열린 PR 을 찾는다.
          find_pr() {
            gh pr list --repo "$REPO" --state open \
              --json number,headRefOid,isDraft,baseRefName,mergeStateStatus,headRepositoryOwner \
              --jq "map(select(.headRefOid == \"$HEAD_SHA\" and .isDraft == false)) | .[0]"
          }

          pr=$(find_pr)
          if [ -z "$pr" ] || [ "$pr" = "null" ]; then
            echo "이 커밋($HEAD_SHA)에 열린 PR 이 없다. 건너뛴다."
            exit 0
          fi
          number=$(echo "$pr" | jq -r '.number')
          state=$(echo "$pr" | jq -r '.mergeStateStatus')

          # GitHub 은 머지 가능 여부를 미리 계산해 두지 않는다. 계산 전에 물으면 UNKNOWN 을 주고
          # 그때부터 백그라운드로 계산한다. CI 직후라 대개 아직이므로, 한 번 보고 포기하면
          # 멀쩡한 PR 이 무작위로 안 머지된다. 확정될 때까지 다시 묻는다.
          for attempt in 1 2 3 4 5; do
            if [ "$state" != "UNKNOWN" ]; then
              break
            fi
            echo "PR #$number 의 mergeStateStatus 가 아직 UNKNOWN 이다. 5초 뒤 다시 확인한다($attempt/5)."
            sleep 5
            pr=$(find_pr)
            if [ -z "$pr" ] || [ "$pr" = "null" ]; then
              echo "PR #$number 가 더 이상 열려 있지 않다. 건너뛴다."
              exit 0
            fi
            state=$(echo "$pr" | jq -r '.mergeStateStatus')
          done

          base=$(echo "$pr" | jq -r '.baseRefName')
          head_owner=$(echo "$pr" | jq -r '.headRepositoryOwner.login // "UNKNOWN"')
          # base=dev 만 자동 머지한다. main 릴리스 PR 은 배포 트리거를 위해 수동으로 머지한다.
          if [ "$base" != "dev" ]; then
            echo "PR #$number 의 base 가 $base 라 자동 머지 대상이 아니다(main 릴리스는 수동)."
            exit 0
          fi
          # CLEAN 만 머지한다. BEHIND(dev 보다 뒤처짐)·DIRTY(충돌)·BLOCKED 는 자동 머지하지 않는다
          # -- 낡은 초록불 머지를 막는다. 뒤처진 PR 은 최신 dev 를 반영해 CI 가 새로 돌면 그때 머지된다.
          if [ "$state" != "CLEAN" ]; then
            echo "PR #$number 의 mergeStateStatus 가 $state 라 자동 머지하지 않는다."
            exit 0
          fi
          # 포크에서 올린 PR 은 자동 머지하지 않는다. workflow_run 은 쓰기 권한 토큰으로 돌기
          # 때문에, 본 저장소 소유자의 브랜치에서 올라온 PR 만 대상으로 한다.
          if [ "$head_owner" != "${REPO%%/*}" ]; then
            echo "PR #$number 의 head 저장소 소유자가 $head_owner 라 자동 머지하지 않는다(포크 PR)."
            exit 0
          fi
          echo "PR #$number 를 squash 머지한다."
          gh pr merge "$number" --repo "$REPO" --squash --delete-branch

name: Deploy Dev (manual)

# dev 브랜치를 수동으로만 배포한다. push 트리거 없이 Actions 탭에서 "Run workflow" 로
# 실행한다.
#
# 경고: 별도 dev 서버가 없어 운영과 같은 EC2 로 배포된다. 이 워크플로를 실행하면 운영 컨테이너가
# 이 dev 이미지로 교체되고, dev 에만 있는 Flyway 마이그레이션이 운영 DB 에 그대로 적용된다.
# 적용된 마이그레이션은 main 으로 되돌려도 복구되지 않는다. 태그를 :dev 로 미는 것은 운영의
# :latest 를 덮지 않을 뿐, 실행 중인 운영 컨테이너가 교체되는 것은 막지 못한다.
#
# 그래서 deploy 잡은 production-dev-image 환경에 묶여 있다. build-and-push 가 끝나면 실행이 멈추고
# 이 환경에 지정된 리뷰어가 승인해야 EC2 배포가 진행된다. 운영 배포(deploy.yml)가 쓰는 production
# 환경과는 분리되어 있어 운영 배포 경로에는 영향이 없다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/buting-be
  DEPLOY_PATH: /home/ec2-user/app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: ./gradlew check --no-daemon

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-dev-image
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Log EC2 in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | ssh "$EC2_USER@$EC2_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Deploy image on EC2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$IMAGE_TAG' '$DOCKERHUB_USERNAME'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          IMAGE_TAG="$2"
          DOCKERHUB_USERNAME="$3"
          cd "$DEPLOY_PATH"

          update_env() {
            KEY="$1"
            VALUE="$2"
            if grep -q "^${KEY}=" .env; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
            else
              printf '%s=%s\n' "$KEY" "$VALUE" >> .env
            fi
          }

          update_env DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME"
          update_env IMAGE_TAG "$IMAGE_TAG"

          sed -i \
            's|sslrootcert=src/main/resources/certs/global-bundle.pem|sslrootcert=/app/certs/global-bundle.pem|g' \
            .env

          docker compose pull app
          docker compose up -d --no-deps app

          for attempt in $(seq 1 12); do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/8080' 2>/dev/null; then
              docker image prune -f
              exit 0
            fi
            sleep 5
          done

          docker compose logs --tail=100 app
          exit 1
          REMOTE

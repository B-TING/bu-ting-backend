name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/buting-be
  DEPLOY_PATH: /home/ec2-user/app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run checks
        run: ./gradlew check --no-daemon

      - name: Set image tag
        id: image
        run: echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.EC2_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Log EC2 in to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          printf '%s' "$DOCKERHUB_TOKEN" | ssh "$EC2_USER@$EC2_HOST" \
            "docker login --username '$DOCKERHUB_USERNAME' --password-stdin"

      - name: Deploy image on EC2
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image-tag }}
        run: |
          ssh "$EC2_USER@$EC2_HOST" \
            "bash -s -- '$DEPLOY_PATH' '$IMAGE_TAG' '$DOCKERHUB_USERNAME'" <<'REMOTE'
          set -euo pipefail
          DEPLOY_PATH="$1"
          IMAGE_TAG="$2"
          DOCKERHUB_USERNAME="$3"
          cd "$DEPLOY_PATH"

          update_env() {
            KEY="$1"
            VALUE="$2"
            if grep -q "^${KEY}=" .env; then
              sed -i "s|^${KEY}=.*|${KEY}=${VALUE}|" .env
            else
              printf '%s=%s\n' "$KEY" "$VALUE" >> .env
            fi
          }

          # 롤백 대상이 될 현재 배포 태그를 덮어쓰기 전에 보관한다.
          # .env에 IMAGE_TAG 줄이 아직 없으면 빈 값이 되고, 이 경우 되돌릴 대상이 없다.
          PREVIOUS_IMAGE_TAG="$( (sed -n 's|^IMAGE_TAG=||p' .env 2>/dev/null || true) | tail -n 1)"

          # Flyway 마이그레이션은 되돌릴 수 없으므로 이미지 롤백이 스키마까지 되돌리지는 못한다.
          # 스키마를 바꾸는 배포가 실패해 롤백되면, 이전 이미지가 새 스키마 위에서 동작하는지
          # 수동으로 확인해야 한다.

          update_env DOCKERHUB_USERNAME "$DOCKERHUB_USERNAME"
          update_env IMAGE_TAG "$IMAGE_TAG"

          # Migrate the old source-tree path to the certificate path bundled in the runtime image.
          sed -i \
            's|sslrootcert=src/main/resources/certs/global-bundle.pem|sslrootcert=/app/certs/global-bundle.pem|g' \
            .env

          # 기동 중 Flyway 마이그레이션이 돌 수 있어 기존 TCP 확인(12 x 5s = 60s)보다 넉넉하게
          # 24 x 5s = 120초까지 기다린다. 액추에이터 health가 DOWN이면 503이 내려오고 curl -f가 실패한다.
          health_check() {
            for attempt in $(seq 1 24); do
              if curl -fsS http://127.0.0.1:8080/actuator/health >/dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            return 1
          }

          docker compose pull app
          docker compose up -d --no-deps app

          if health_check; then
            docker image prune -f
            exit 0
          fi

          echo "헬스체크 실패: 새 이미지(${IMAGE_TAG})가 정상 기동하지 않았다."
          docker compose logs --tail=100 app

          if [ -z "$PREVIOUS_IMAGE_TAG" ]; then
            echo "이전 IMAGE_TAG가 .env에 없어 롤백할 대상이 없다. 컨테이너를 수동으로 확인해야 한다."
            exit 1
          fi

          echo "이전 이미지(${PREVIOUS_IMAGE_TAG})로 롤백한다."
          update_env IMAGE_TAG "$PREVIOUS_IMAGE_TAG"

          if docker compose pull app && docker compose up -d --no-deps app && health_check; then
            echo "롤백 완료: 이전 이미지(${PREVIOUS_IMAGE_TAG})가 정상 동작한다. 배포 자체는 실패로 처리한다."
            exit 1
          fi

          echo "롤백 실패: 이전 이미지(${PREVIOUS_IMAGE_TAG})도 헬스체크를 통과하지 못했다. 수동 조치가 필요하다."
          docker compose logs --tail=100 app
          exit 1
          REMOTE

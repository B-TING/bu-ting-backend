name: Parent Feature
description: 여러 하위 이슈로 나누어 진행할 큰 기능을 추적합니다.
title: "feat: "
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        **부모 이슈입니다.** Type은 `Feature`로 자동 지정됩니다.
        라벨은 아래에서 고른 **도메인/영역 라벨만** 붙여주세요.
        `feature`, `fix`, `refactor` 같은 git convention 라벨은 하위 이슈에만 붙입니다.

  - type: textarea
    id: summary
    attributes:
      label: 작업 목적
      description: 이 부모 이슈가 추적하는 큰 기능과 방향을 적어주세요.
      placeholder: 예) 사용자 도메인의 기본 API, OAuth2.0 로그인, 인증된 사용자 정보 API, 다국어 응답을 단계적으로 구현한다.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 도메인 / 영역
      description: 이 기능이 건드리는 영역을 모두 선택하고, 같은 이름의 라벨을 이슈에 붙여주세요.
      options:
        - auth
        - chat
        - file
        - place
        - station
        - storage
        - travel
        - travelexpense
        - travelrecord
        - travelsurvey
        - travelteam
        - user
        - config
        - ci
        - db
        - global
        - i18n
        - docs
      multiple: true
    validations:
      required: true

  - type: textarea
    id: child_issues
    attributes:
      label: 하위 이슈
      description: 실제 구현 범위는 하위 이슈에서 관리합니다. 이슈 생성 후 번호를 연결해주세요.
      value: |
        - [ ] #
        - [ ] #
        - [ ] #
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 부모 이슈가 완료되었다고 판단할 전체 기준만 적어주세요.
      value: |
        - [ ] 모든 하위 이슈가 완료된다.
        - [ ] 핵심 사용자 흐름이 통합 관점에서 검증된다.
    validations:
      required: true

  - type: input
    id: schedule
    attributes:
      label: 작업 기간
      description: "YYYY-MM-DD ~ YYYY-MM-DD 형식으로 적어주세요."
      placeholder: "2026-09-05 ~ 2026-09-12"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 브랜치, PR, 설계 결정, 논의 내용을 적어주세요.
      placeholder: "예) 하위 이슈에서 브랜치를 만듭니다. 부모 이슈로는 브랜치를 만들지 않습니다."

name: Task / Sub-issue
description: 부모 이슈에 연결할 구체적인 구현 작업을 작성합니다.
title: "feat: "
type: Task
body:
  - type: markdown
    attributes:
      value: |
        **하위 이슈입니다.** Type은 `Task`로 자동 지정됩니다. 버그 수정이면 생성 후 Type을 `Bug`로 바꿔주세요.
        라벨은 **도메인/영역 라벨 + git convention 라벨 1개**를 붙여주세요. (예: `storage`, `feature`)
        제목의 `feat:` 접두사도 실제 작업 종류에 맞게 바꿔주세요.

  - type: textarea
    id: summary
    attributes:
      label: 작업 목적
      description: 왜 이 작업이 필요한지 간단히 적어주세요.
      placeholder: 예) OAuth2.0 Provider를 통해 사용자가 로그인할 수 있도록 인증 흐름을 구현한다.
    validations:
      required: true

  - type: textarea
    id: scope
    attributes:
      label: 작업 범위
      description: 구현하거나 수정할 내용을 체크리스트로 적어주세요.
      value: |
        - [ ] 
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 도메인 / 영역
      description: 이 작업이 실제로 건드리는 영역만 선택하고, 같은 이름의 라벨을 이슈에 붙여주세요.
      options:
        - auth
        - chat
        - file
        - place
        - station
        - storage
        - travel
        - travelexpense
        - travelrecord
        - travelsurvey
        - travelteam
        - user
        - config
        - ci
        - db
        - global
        - i18n
        - docs
      multiple: true
    validations:
      required: true

  - type: dropdown
    id: convention
    attributes:
      label: 작업 종류
      description: 커밋·브랜치 type과 같은 값을 하나만 선택하고, 같은 이름의 라벨을 이슈에 붙여주세요.
      options:
        - feature
        - fix
        - refactor
        - test
        - docs
        - chore
        - hotfix
      multiple: false
    validations:
      required: true

  - type: checkboxes
    id: languages
    attributes:
      label: 다국어 지원 대상
      description: 국제화 작업인 경우 지원할 언어를 선택해주세요.
      options:
        - label: 한국어(ko)
        - label: 영어(en)
        - label: 일본어(ja)
        - label: 중국어(zh)

  - type: textarea
    id: api_example
    attributes:
      label: API 예시
      description: 요청/응답 예시가 있다면 적어주세요.
      render: http
      placeholder: |
        GET /api/v1/users/me
        Authorization: Bearer <access-token>

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 조건
      description: 이 이슈가 완료되었다고 판단할 기준을 적어주세요.
      value: |
        - [ ] 기능이 정상 동작한다.
        - [ ] 테스트가 추가되거나 기존 테스트가 통과한다.
        - [ ] 문서 또는 사용 방법이 필요한 경우 함께 갱신한다.
    validations:
      required: true

  - type: textarea
    id: test_plan
    attributes:
      label: 검증 방법
      description: 어떤 명령이나 시나리오로 검증할지 적어주세요.
      value: |
        ```bash
        ./gradlew check
        ```
    validations:
      required: true

  - type: input
    id: parent_issue
    attributes:
      label: 부모 이슈
      description: "연결할 부모 이슈가 있다면 `Parent: #<번호>` 형식으로 적어주세요. 브랜치 하나로 끝나는 작업이면 비워둬도 됩니다."
      placeholder: "Parent: #12"

  - type: input
    id: schedule
    attributes:
      label: 작업 예정일
      description: "YYYY-MM-DD 형식으로 적어주세요."
      placeholder: "2026-09-05"
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: 참고 사항
      description: 관련 브랜치, PR, 설계 결정, 논의 내용을 적어주세요.
